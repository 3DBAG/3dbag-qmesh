[project]
name = "3dbag-qmesh"
version = "0.1.0"
description = "Generate quantized-mesh terrain tiles from raster elevation data for the 3D BAG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "gdal==3.11.4",
    "numpy>=1.26",
    "scipy>=1.16.2",
    "rasterio>=1.4.3",
    "pydelatin>=0.3.0",
    "quantized-mesh-encoder>=0.5.0",
]

[project.scripts]
qmesh = "qmesh.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qmesh"]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.0.0",
]
